name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --all-groups --locked
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy src/
      - name: Pytest
        run: uv run pytest

