[project]
name = "ordnance-id"
version = "0.1.0"
description = "Decision-support research prototype for family-level UXO identification."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "google-genai>=1.0,<2",
    "httpx>=0.27,<1",
    "matplotlib>=3.9,<4",
    "opencv-python-headless>=4.10,<5",
    "pillow>=10,<13",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "python-multipart>=0.0.12,<1",
    "pyyaml>=6,<7",
    "rich>=13,<15",
    "typer>=0.12,<1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.11,<2",
    "piexif>=1.1,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.6,<1",
    "types-pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
